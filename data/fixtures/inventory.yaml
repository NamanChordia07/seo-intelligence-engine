    # What Is Forex Trading? A Beginner's Guide

    > SIMULATED INVENTORY PAGE - stands in for an article that already exists on the target site.

    Forex (foreign exchange) trading is the buying of one currency while selling another, quoted as a currency
    pair. Prices move with interest rates, economic data and market sentiment. This beginner guide explains
    currency pairs, quotes, base and quote currencies, and why leveraged products are risky for retail traders.

    ## Currency pairs and quotes
    A quote such as EUR/USD shows how many US dollars one euro buys. The first currency is the base, the second
    the quote currency.

    ## Who trades currencies
    Banks, companies hedging payments, funds and individual speculators all take part in currency markets.
