    # Leverage and Margin Explained: Risk Management Basics

    > SIMULATED INVENTORY PAGE - stands in for an article that already exists on the target site.

    Leverage lets a trader control a position larger than the cash deposited as margin. It magnifies gains and
    losses equally. This guide covers margin, margin calls, stop-out levels and position sizing.

    ## Margin and margin calls
    When losses reduce account equity below the required margin, positions may be closed automatically.

    ## Position sizing
    Risking a small, fixed fraction of the account on each trade limits the damage from a losing streak.
