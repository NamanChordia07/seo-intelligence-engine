faq:
  - question: "Which is better, Exness or XM?"
    answer: "We do not declare a winner. Costs and conditions vary by entity and account type, and we could not verify like-for-like live data. Use the method above to compare on your own account type."
  - question: "Are Exness and XM legal in India?"
    answer: "Do not assume so. RBI permits residents to trade forex only with authorised entities on authorised platforms or recognised exchanges, and absence from the Alert List is not authorisation.[[E:rbi-alert-list-2022]]"
  - question: "How do I check a broker's licence?"
    answer: "Find the legal entity in your client agreement and search it on the regulator's own register, such as the FCA Register.[[E:fca-register]]"
  - question: "Why doesn't this page list spreads?"
    answer: "Because we could not verify them from a primary source for the same account type and time. Publishing unverified numbers would be misleading."
key_takeaways:
  - "Authorisation for Indian residents is the first filter for both brokers."
  - "Licence claims must be checked on regulator registers for the exact entity."
  - "No verified data supports declaring a winner."
