language: hi
title: "फॉरेक्स स्प्रेड और फीस क्या हैं? असली ट्रेडिंग लागत कैसे समझें"
h1: "फॉरेक्स स्प्रेड क्या है? स्प्रेड, कमीशन और स्वैप से असली लागत का हिसाब"
slug: "forex-spread-aur-fees-kya-hai"
meta_description: "फॉरेक्स स्प्रेड, पिप, कमीशन और ओवरनाइट स्वैप आसान हिंदी में समझें — एक उदाहरण के साथ असली ट्रेडिंग लागत का हिसाब और छिपे खर्चों की चेकलिस्ट।"
angle: "Hindi explainer that turns jargon (spread, pip, swap) into a worked, clearly-labelled illustrative calculation - no broker numbers."
audience: "Hindi-speaking beginners comparing trading costs across platforms"
introduction: |
  किसी भी ट्रेड की असली लागत सिर्फ़ विज्ञापन में लिखा "लो स्प्रेड" नहीं होती। स्प्रेड, कमीशन, रातभर पोज़िशन रखने का स्वैप और करेंसी कन्वर्ज़न — ये सब मिलकर तय करते हैं कि आपको कितना खर्च पड़ेगा। इस गाइड में हम इन शब्दों को आसान हिंदी में समझाएँगे और एक साफ़ तौर पर चिह्नित उदाहरण से लागत का हिसाब लगाना सिखाएँगे, ताकि आप किसी भी प्लेटफॉर्म की तुलना खुद कर सकें।
sections:
  - heading: "स्प्रेड क्या होता है?"
    body: |
      स्प्रेड किसी एसेट के बिड (बेचने) और आस्क (खरीदने) भाव के बीच का अंतर है; फॉरेक्स में इसे आमतौर पर पिप में मापा जाता है।[[E:investopedia-spread]] जब आप ट्रेड खोलते हैं, तो आप आस्क भाव पर खरीदते हैं और बिड भाव पर बेच सकते हैं — इसलिए ट्रेड खुलते ही वह स्प्रेड जितने नुकसान में दिखता है।

      स्प्रेड स्थिर नहीं रहता। कम लिक्विडिटी के समय, बड़ी आर्थिक ख़बरों के आसपास या बाज़ार खुलने-बंद होने के वक्त यह चौड़ा हो सकता है।
  - heading: "पिप क्या है?"
    body: |
      पिप करेंसी पेयर में भाव की सबसे छोटी मानक चाल है — ज़्यादातर पेयर में 0.0001 और येन वाले पेयर में 0.01।[[E:investopedia-pip]] स्प्रेड, स्टॉप-लॉस और मुनाफ़ा-नुकसान अक्सर पिप में ही बताए जाते हैं, इसलिए लागत समझने के लिए पिप की कीमत जानना ज़रूरी है।
  - heading: "कमीशन और स्वैप (ओवरनाइट शुल्क)"
    body: |
      कुछ अकाउंट में स्प्रेड कम होता है लेकिन हर ट्रेड पर अलग से कमीशन लगता है, जबकि कुछ में कमीशन नहीं होता पर स्प्रेड ज़्यादा होता है। इसलिए दोनों को जोड़कर ही तुलना करें।

      अगर आप पोज़िशन को रातभर खुला रखते हैं, तो स्वैप या रोलओवर लागू होता है — यह पोज़िशन रखने पर चुकाया या मिलने वाला ब्याज है।[[E:investopedia-rollover]] लंबे समय तक पोज़िशन रखने वालों के लिए स्वैप कई बार स्प्रेड से भी बड़ा खर्च बन जाता है।
  - heading: "लागत का हिसाब: एक उदाहरण"
    body: |
      **उदाहरण (केवल समझाने के लिए, किसी ब्रोकर का वास्तविक भाव नहीं):** मान लीजिए किसी पेयर पर स्प्रेड 1.5 पिप है, एक पिप की कीमत आपकी पोज़िशन साइज़ पर ₹80 है, और प्रति ट्रेड कमीशन ₹100 है। तब ट्रेड खोलने की लागत = 1.5 × ₹80 + ₹100 = ₹220। अगर आप पोज़िशन तीन रात खुली रखते हैं और स्वैप ₹40 प्रति रात है, तो कुल लागत ₹220 + ₹120 = ₹340 हो जाती है।

      इस उदाहरण का मकसद तरीका सिखाना है: अपने प्लेटफॉर्म के लाइव भाव, अपनी पोज़िशन साइज़ और उसकी आधिकारिक फीस-सूची लेकर यही गणना खुद करें।
  - heading: "छिपे हुए खर्च जिन्हें लोग भूल जाते हैं"
    body: |
      - **करेंसी कन्वर्ज़न:** अगर अकाउंट की मुद्रा आपकी जमा राशि से अलग है, तो जमा और निकासी दोनों पर कन्वर्ज़न लागत लग सकती है।
      - **निष्क्रियता शुल्क:** कुछ प्लेटफॉर्म लंबे समय तक ट्रेड न करने पर शुल्क लेते हैं।
      - **निकासी शुल्क और बैंक चार्ज:** अंतरराष्ट्रीय ट्रांसफर पर बैंक अलग से शुल्क ले सकता है। निकासी से जुड़ी परेशानियों के लिए [[L:withdrawal:generic|निकासी गाइड]] देखें।
      - **स्लिपेज:** तेज़ बाज़ार में ऑर्डर अपेक्षित भाव से अलग भाव पर भर सकता है।
  - heading: "ब्रोकरों की लागत की तुलना कैसे करें"
    body: |
      एक ही इंस्ट्रूमेंट, एक ही अकाउंट टाइप और एक ही समय पर दोनों प्लेटफॉर्म के लाइव भाव रिकॉर्ड करें, फिर कमीशन और स्वैप जोड़ें। विज्ञापन में लिखे "से शुरू" वाले स्प्रेड पर भरोसा न करें। दो ब्रोकरों की तुलना का पूरा ढाँचा हमारे लेख [[L:comparison:exness+xm|Exness बनाम XM तुलना फ्रेमवर्क]] में दिया गया है।

      याद रखें कि लागत कम होना जोखिम कम होना नहीं है। लीवरेज के साथ छोटी लागत भी बड़े नुकसान में बदल सकती है — [[L:leverage:generic|लीवरेज और मार्जिन का जोखिम]] ज़रूर समझें।
  - heading: "भारत में कानूनी स्थिति को न भूलें"
    body: |
      लागत की तुलना से पहले यह देखें कि प्लेटफॉर्म भारतीय निवासियों के लिए अनुमत है या नहीं। RBI के अनुसार निवासी फॉरेक्स लेनदेन केवल अधिकृत प्लेटफॉर्म या मान्यता प्राप्त एक्सचेंज पर ही कर सकते हैं।[[E:rbi-forex-faq]] विस्तार से जानने के लिए [[L:regulation:generic|भारत में फॉरेक्स ट्रेडिंग की कानूनी स्थिति]] पढ़ें।
faq:
  - question: "क्या कम स्प्रेड वाला प्लेटफॉर्म हमेशा सस्ता होता है?"
    answer: "ज़रूरी नहीं। कम स्प्रेड के साथ कमीशन या ज़्यादा स्वैप लग सकता है। कुल लागत = स्प्रेड + कमीशन + स्वैप + अन्य शुल्क।"
  - question: "स्प्रेड ख़बरों के समय क्यों बढ़ जाता है?"
    answer: "बड़ी आर्थिक ख़बरों के आसपास लिक्विडिटी घट सकती है और अस्थिरता बढ़ती है, जिससे बिड और आस्क के बीच अंतर चौड़ा हो सकता है।"
  - question: "स्वैप से कैसे बचें?"
    answer: "स्वैप तभी लगता है जब पोज़िशन रातभर खुली रहती है।[[E:investopedia-rollover]] इसकी दर प्लेटफॉर्म की आधिकारिक फीस-सूची में देखें और लंबी अवधि की पोज़िशन की लागत पहले से जोड़ें।"
  - question: "एक पिप कितना होता है?"
    answer: "ज़्यादातर करेंसी पेयर में एक पिप 0.0001 होता है और येन पेयर में 0.01।[[E:investopedia-pip]]"
key_takeaways:
  - "कुल लागत = स्प्रेड + कमीशन + स्वैप + छिपे शुल्क।"
  - "विज्ञापित स्प्रेड नहीं, लाइव भाव से तुलना करें।"
  - "कम लागत का मतलब कम जोखिम नहीं है।"
