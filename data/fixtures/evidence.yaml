- key: rbi-alert-list-2022
  url: "https://www.rbi.org.in/scripts/BS_PressReleaseDisplay.aspx?prid=54333"
  title: "RBI issues Alert List of entities not authorised to deal in forex and to operate electronic trading platforms for forex transactions"
  publisher: Reserve Bank of India
  source_class: PRIMARY_REGULATOR
  published_at: "2022-09-07"
  tags: [regulation, alternative, comparison, withdrawal, login, fees, india]
  snippet: >-
    RBI published an Alert List of entities that are neither authorised to deal in forex under FEMA nor
    authorised to operate ETPs for forex transactions. "An entity not appearing in the Alert List should not be
    assumed to be authorised by the RBI." Resident persons can undertake forex transactions only with authorised
    persons and on authorised ETPs or recognised stock exchanges.
  claims:
    - {key: alert-list-exists, claim: "RBI maintains an Alert List of unauthorised forex trading platforms", type: regulation, confidence: 0.95, status: VERIFIED_SNAPSHOT}
    - {key: alert-list-not-exhaustive, claim: "Absence from the Alert List does not mean an entity is authorised", type: regulation, confidence: 0.95, status: VERIFIED_SNAPSHOT}
    - {key: residents-authorised-only, claim: "Residents may undertake forex transactions only with authorised persons / on authorised ETPs or recognised exchanges", type: regulation, confidence: 0.9, status: VERIFIED_SNAPSHOT}

- key: rbi-forex-faq
  url: "https://rbi.org.in/Scripts/FAQView.aspx?Id=146"
  title: "Frequently Asked Questions - Foreign Exchange (Forex) Transactions"
  publisher: Reserve Bank of India
  source_class: PRIMARY_REGULATOR
  published_at: "2022-09-07"
  tags: [regulation, alternative, leverage, fees, comparison, withdrawal, india]
  snippet: >-
    Permitted forex transactions executed electronically should be undertaken only on ETPs authorised by RBI or on
    recognised stock exchanges (NSE, BSE, MSE). Residents may trade exchange-traded currency futures/options in
    USD-INR, EUR-INR, GBP-INR, JPY-INR and the cross pairs EUR-USD, GBP-USD and USD-JPY. Residents remitting or
    depositing money for unauthorised forex transactions render themselves liable for penal action under FEMA.
  claims:
    - {key: etp-or-exchange-only, claim: "Electronic forex trades must be on RBI-authorised ETPs or recognised exchanges", type: regulation, confidence: 0.95, status: VERIFIED_SNAPSHOT}
    - {key: permitted-pairs, claim: "Exchange-traded currency derivatives are permitted in USD-INR, EUR-INR, GBP-INR, JPY-INR, EUR-USD, GBP-USD, USD-JPY", type: regulation, confidence: 0.85, status: VERIFIED_SNAPSHOT}
    - {key: fema-penal-action, claim: "Residents dealing on unauthorised platforms are liable to penal action under FEMA", type: regulation, confidence: 0.9, status: VERIFIED_SNAPSHOT}

- key: esma-cfd-2018
  url: "https://www.esma.europa.eu/node/84933"
  title: "ESMA agrees to prohibit binary options and restrict CFDs to protect retail investors"
  publisher: European Securities and Markets Authority
  source_class: PRIMARY_REGULATOR
  published_at: "2018-03-27"
  tags: [leverage, fees, comparison, risk, regulation]
  snippet: >-
    National regulators' analyses found that 74-89% of retail accounts typically lose money on CFDs. ESMA's
    measures included leverage limits for retail clients from 30:1 to 2:1 depending on the underlying's
    volatility and a standardised risk warning. (2018 finding - historical context, not a current statistic.)
  claims:
    - {key: cfd-loss-rate, claim: "74-89% of retail CFD accounts typically lost money (ESMA, 2018)", type: statistic, confidence: 0.9, status: VERIFIED_SNAPSHOT}
    - {key: esma-leverage-limits, claim: "ESMA retail leverage limits ranged from 30:1 to 2:1 (2018)", type: regulation, confidence: 0.9, status: VERIFIED_SNAPSHOT}

