[project]
name = "atlas-seo-intelligence-engine"
version = "0.1.0"
description = "ATLAS - Autonomous Search Intelligence & Content Operations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "alembic>=1.13",
    "temporalio>=1.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
crawl = ["crawl4ai>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL (ATLAS_TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web", ".data", "infra/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607", "S608", "S310"]  # local dev tooling invoking fixed, project-local binaries
"packages/contracts/enums.py" = ["S105"]  # "PASS" is a compliance status, not a password
"tests/*" = ["S", "B017"]
